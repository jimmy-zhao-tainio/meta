name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      run_perf_1m:
        description: "Run optional 1M-row performance gate"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  correctness:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Metadata.Framework.sln

      - name: Build
        run: dotnet build Metadata.Framework.sln --configuration Release --no-restore --nologo -m:1 -nr:false -p:UpdateMetaPublishDir=false -p:UpdateMetaDocsPublishDir=false -p:UpdateMetaWeavePublishDir=false

      - name: Test (correctness)
        shell: pwsh
        run: ./eng/test.ps1 -Profile Correctness -Configuration Release -NoBuild -MaxConcurrency 4

  perf_100k:
    runs-on: windows-latest
    needs: correctness
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Meta/Surfaces.Xml.Tests/Meta.Surfaces.Xml.Tests.csproj
      - name: Build
        run: dotnet build Meta/Surfaces.Xml.Tests/Meta.Surfaces.Xml.Tests.csproj --configuration Release --no-restore --nologo -m:1 -nr:false
      - name: Test (performance 100k gate)
        env:
          Meta_PERF_ROWS: 100000
          Meta_PERF_MAX_SAVE_MS: 45000
          Meta_PERF_MAX_LOAD_MS: 45000
          Meta_PERF_MAX_ALLOCATED_MB: 2048
        shell: pwsh
        run: ./eng/test.ps1 -Profile Performance100K -Configuration Release -NoBuild -MaxConcurrency 1

  perf_1m_optional:
    runs-on: windows-latest
    needs: correctness
    if: github.event_name == 'workflow_dispatch' && inputs.run_perf_1m == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Meta/Surfaces.Xml.Tests/Meta.Surfaces.Xml.Tests.csproj
      - name: Build
        run: dotnet build Meta/Surfaces.Xml.Tests/Meta.Surfaces.Xml.Tests.csproj --configuration Release --no-restore --nologo -m:1 -nr:false
      - name: Test (performance 1m optional gate)
        env:
          Meta_ENABLE_1M_PERF_TEST: 1
          Meta_PERF_1M_MAX_SAVE_MS: 300000
          Meta_PERF_1M_MAX_LOAD_MS: 300000
          Meta_PERF_1M_MAX_ALLOCATED_MB: 6144
        shell: pwsh
        run: ./eng/test.ps1 -Profile Performance1M -Configuration Release -NoBuild -MaxConcurrency 1
